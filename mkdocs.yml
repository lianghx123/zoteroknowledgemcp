            Support and compatibility: Assistance et compatibilité
        - locale: es-ES
          name: Español
          theme:
            language: es
            palette:
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-4
                  name: Cambiar al modo oscuro
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-7
                  name: Cambiar al modo claro
          site_description: Guía de usuario del complemento Zotero Knowledge MCP
          nav_translations:
            Welcome: Bienvenida
            Getting started: Primeros pasos
            Install and upgrade: Instalación y actualización
            First document: Primer documento
            Configure services: Configurar servicios
            Using the plugin: Usar el complemento
            Knowledge libraries: Bibliotecas de conocimiento
            Search: Búsqueda
            Read and edit: Lectura y edición
            Connect an AI client: Conectar un cliente de IA
            Help: Ayuda
            Data and privacy: Datos y privacidad
            Troubleshooting: Solución de problemas
            Support and compatibility: Asistencia y compatibilidad
        - locale: ja-JP
          name: 日本語
          theme:
            language: ja
            palette:
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-4
                  name: ダークモードに切り替え
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-7
                  name: ライトモードに切り替え
          site_description: Zotero Knowledge MCP プラグインのユーザーガイド
          nav_translations:
            Welcome: ようこそ
            Getting started: はじめに
            Install and upgrade: インストールと更新
            First document: 最初の文献を処理
            Configure services: サービスの設定
            Using the plugin: プラグインの使い方
            Knowledge libraries: ナレッジライブラリ
            Search: 検索
            Read and edit: 閲覧と編集
