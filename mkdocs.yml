            Help: Hilfe
            Data and privacy: Daten und Datenschutz
            Troubleshooting: Fehlerbehebung
            Support and compatibility: Support und Kompatibilität
        - locale: fr-FR
          name: Français
          theme:
            language: fr
            palette:
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-4
                  name: Passer au thème sombre
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-7
                  name: Passer au thème clair
          site_description: Guide utilisateur du module Zotero Knowledge MCP
          nav_translations:
            Welcome: Bienvenue
            Getting started: Premiers pas
            Install and upgrade: Installation et mise à niveau
            First document: Premier document
            Configure services: Configurer les services
