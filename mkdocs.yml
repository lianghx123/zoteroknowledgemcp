  - search:
      lang: [en, de, fr, es, ja, zh]
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - Welcome: index.md
  - Getting started:
      - Install and upgrade: installation.md
      - First document: quick-start.md
      - Configure services: configuration.md
  - Using the plugin:
      - Knowledge libraries: knowledge-libraries.md
      - Search: search.md
      - Read and edit: reader.md
      - Connect an AI client: mcp.md
  - Help:
      - Data and privacy: privacy.md
      - Troubleshooting: troubleshooting.md
      - Support and compatibility: support.md
